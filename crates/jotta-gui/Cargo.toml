[package]
name = "jotta-gui"
version = "0.1.0"
edition = "2021"
description = "GTK4/libadwaita GUI for Jotta Desktop."
license = "MPL-2.0"

[dependencies]
jotta-core = { path = "../jotta-core" }
glib = "0.20"
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_5"] }

[[bin]]
name = "jotta-desktop"
path = "src/main.rs"
